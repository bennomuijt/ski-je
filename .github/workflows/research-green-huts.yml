name: Controle groene hutnummers 2026/27
on:
  push:
    branches:
      - feature/clickable-green-huts-panorama-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf==1.26.5'
      - name: Extract all numeric map text from the official SkiWelt PDF
        run: python scripts/research-green-huts.py
      - name: Keep numeric text positions for review
        uses: actions/upload-artifact@v4
        with:
          name: skiwelt-green-hut-research
          path: |
            test-artifacts/skiwelt-all-pdf-numbers.json
            test-artifacts/skiwelt-white-pdf-labels.json
          retention-days: 7
          if-no-files-found: error
