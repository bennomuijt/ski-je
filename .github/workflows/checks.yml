name: SKI-je checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Inspect official SkiWelt 2026-27 full panorama (informational)
        shell: bash
        run: |
          url="https://media.skiwelt.at/media/panorama/winter/SkiWelt-Panorama-26-27-NL.jpg"
          echo "Checking image MIME and access for official panorama URL..."
          result=$(curl -L -sS --max-time 40 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$url" || true)
          echo "Official panorama: $result"
          # Do not fail unit tests due to temporary external media downtime.
      - name: Probe public Cloudflare release (informational)
        shell: bash
        run: |
          echo "Live health:"
          curl -L -sS --max-time 18 -w '\nHTTP %{http_code} %{content_type}\n' 'https://ski-je.bennomuijt.workers.dev/api/health' || true
          echo "Live full panorama:"
          curl -L -sS --max-time 30 -o /dev/null -w 'HTTP %{http_code} %{content_type} %{size_download}\n' 'https://ski-je.bennomuijt.workers.dev/api/skimap.jpg' || true
          echo "Live installation page:"
          curl -L -sS --max-time 18 -o /dev/null -w 'HTTP %{http_code} %{content_type}\n' 'https://ski-je.bennomuijt.workers.dev/install.html' || true
      - name: Prepare headless Chrome regression
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core
      - name: Test proposed clickable lift and restaurant panels in mobile browser
        run: node tests/panorama-layers-browser.mjs
      - name: Test service worker upgrades in mobile Chrome
        run: |
          # Exercise migration from the actual 4.5.14 release before the new photos.
          git fetch --no-tags --depth=1 origin 4868b58fd19d3070ca819d2040fa19a33ebe6ad3
          legacy="$(mktemp -d)"
          git archive FETCH_HEAD | tar -x -C "$legacy"
          cp public/icons/icon-{192,512}-v455.png "$legacy/public/icons/"
          node tests/app-update-browser.mjs "$legacy"
      - name: Test actual SKI-je UI, PDF, map and webcam on mobile viewport
        run: node tests/browser-smoke.mjs
      - name: Save browser screenshots and PDF for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skije-mobile-regression
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
