name: SKI-je panorama PDF detail review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/panorama-detail-audit.yml'
      - 'scripts/panorama-detail-audit.py'
      - 'public/skiwelt-printed-hut-labels.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PDF renderer
        run: |
          if ! command -v pdftoppm >/dev/null || ! /usr/bin/python3 -c 'import PIL' >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils python3-pil
          fi
      - name: Download and render operator PDF
        run: /usr/bin/python3 scripts/panorama-detail-audit.py
      - name: Preserve full map and hut detail crops for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skiwelt-panorama-detail-2026-27
          path: panorama-detail-evidence/
          retention-days: 7
          if-no-files-found: warn
