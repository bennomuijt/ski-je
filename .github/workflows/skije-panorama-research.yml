name: Research official SkiWelt panorama labels
on:
  push:
    branches:
      - research/skije-kaartcoordinaten-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF text layout reader
        run: pip install pymupdf==1.26.6
      - name: Inspect only (no publishing or location guesses)
        run: python tools/extract_panorama_positions.py
