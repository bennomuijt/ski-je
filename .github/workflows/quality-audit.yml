name: SKI-je recurring quality audit
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/quality-audit.yml'
      - 'scripts/quality-audit.mjs'
      - 'public/skiwelt-map-router.js'
      - 'public/skiwelt-network-graph.json'
permissions:
  contents: read
concurrency:
  group: skije-quality-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit routes, terrain data and public endpoints
        run: node scripts/quality-audit.mjs
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skije-quality-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-audit.json
          retention-days: 14
          if-no-files-found: warn
